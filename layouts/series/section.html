{{ define "main" }}
{{ if .Params.works }}
{{ partial "artwork.html" . }}
{{ else }}
<!-- Это список всех серий -->
<main class="page">
    <h1 class="page__title">{{ .Title }}</h1>

    <section class="slide__gallery" aria-label="Все серии">
        <div class="gallery-grid">
        {{ range sort .Pages "Weight" "asc" }}
            {{ if .Params.works }}
                {{ partial "card.html" (dict "page" .) }}
            {{ end }}
        {{ end }}
        </div>
    </section>
</main>
{{ end }}
{{ end }}
